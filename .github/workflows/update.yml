---
# Upgrade-safety gate: proves a PR's manifest changes apply cleanly to an
# ALREADY-RUNNING cluster, not just a fresh one. `local.yml` bootstraps a new
# cluster from the PR branch (fresh convergence); this bootstraps on `master`
# (the state running clusters are in), then repoints Flux at the PR HEAD and
# re-verifies -- catching immutable-field changes, `prune: true` deletions, and
# CRD/chart upgrade breakage that only surface on a transition. Because
# production/downstream clusters track the published manifests, a bad merge would
# reach them ungated; this is the gate.
#
# Runs on kind (noble-32), not a real DOKS cluster: the transition this proves is
# pure Flux/Kustomization mechanics (does the PR's flux/ tree reconcile cleanly
# over master's), with nothing DOKS-specific in it. See the `reduce-doks-ci-cost`
# migration.
#
# Runs on every PR (no `paths:` filter) so the `update` gate always reports a
# status -- required checks that are path-filtered stall PRs forever. The
# expensive `upgrade` job is instead skipped internally when flux/** is untouched
# (only manifests can break a manifest upgrade). Make the `update` job the
# required status check.
name: update
on:
  pull_request:
permissions: {}
env:
  FORCE_COLOR: ""
  NO_COLOR: "1"
  KUBECONFIG: .kubeconfig
  BASE_DOMAIN: update.dantofa.dev
  CONTROL: "1" # kind control-plane nodes
  WORKERS: "2" # kind worker nodes
jobs:
  # Does this PR touch the reconciled manifests? Only those can break an upgrade.
  detect:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      flux: ${{ steps.filter.outputs.flux }}
    steps:
      - name: Detect flux/** changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -q '^flux/'; then
            echo "flux=true" >> "$GITHUB_OUTPUT"
          else
            echo "flux=false" >> "$GITHUB_OUTPUT"
          fi

  # The expensive two-phase upgrade test; only runs when manifests changed.
  upgrade:
    needs: detect
    if: needs.detect.outputs.flux == 'true'
    runs-on: noble-32
    timeout-minutes: 60
    environment: preview
    permissions:
      contents: read
    outputs:
      baseline_failed: ${{ steps.flag-baseline-failure.outputs.failed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history (not the default shallow clone): phase 1 below needs
          # origin/master's flux/ tree available locally, since `local cluster
          # bootstrap`/`push` package whatever's currently on disk rather than
          # pulling a git ref the way the DOKS git-source flow did.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'go.sum', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Create update cluster
        run: nix run .#default -- local cluster create --control-planes "$CONTROL" --workers "$WORKERS"

      - name: Verify provisioning
        run: |
          nix run .#default -- local cluster connect
          nix develop --command kubectl wait --for=condition=Ready nodes --all --timeout=180s

      # Phase 1: bootstrap on master's flux/ tree -- the state a running cluster
      # is already in. `git checkout -- flux/` overlays those files onto the
      # working tree without touching HEAD, so dctl itself still builds from the
      # PR's Go code; only the packaged manifests are master's.
      - name: Bootstrap on master
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_PROJECT_ID }}
          BWS_ORGANIZATION_ID: ${{ vars.BWS_ORGANIZATION_ID }}
        run: |
          git checkout origin/master -- flux/
          nix run .#default -- local cluster bootstrap --base-domain "$BASE_DOMAIN" \
            --bitwarden-token "$BWS_ACCESS_TOKEN" \
            --bitwarden-project-id "$BWS_PROJECT_ID" --bitwarden-org-id "$BWS_ORGANIZATION_ID"

      - name: Verify the master baseline converges
        id: verify-baseline
        run: nix run .#default -- flux kustomization verify --wait --timeout 900s --kubeconfig .kubeconfig

      # A failure here means the PR was never actually tested -- master itself
      # didn't converge on a fresh cluster, for reasons that have nothing to do
      # with this PR's changes. Flag it distinctly (both as a run annotation and
      # a job output the `update` gate reads) so a red check here reads as "the
      # platform is flaky, re-run" rather than "this PR broke the upgrade" --
      # conflating the two trains the exact reflex that makes the gate
      # worthless the day it catches a real break.
      - name: Flag a baseline failure
        id: flag-baseline-failure
        if: failure() && steps.verify-baseline.outcome == 'failure'
        run: |
          echo "::warning::The master baseline failed to converge before this PR's revision was even applied -- a platform/infrastructure flake, not something this PR broke. See 'Verify the master baseline converges' for the real cause."
          echo "failed=true" >> "$GITHUB_OUTPUT"

      # Phase 2: restore the PR's own flux/ tree and re-publish -- `local cluster
      # push` packages the new OCI digest and blocks on Flux's OCIRepository
      # reconciling it, firing the re-reconcile of every dependent Kustomization
      # against the PR's manifests. The actual upgrade transition.
      - name: Upgrade to the PR revision
        run: |
          git checkout HEAD -- flux/
          nix run .#default -- local cluster push

      # The gate: the PR's manifests must reconcile as an upgrade over master.
      # A failure here is an immutable-field/prune/CRD-upgrade break that a
      # fresh-cluster test (local.yml) would not catch.
      - name: Verify the PR upgrade converges
        run: nix run .#default -- flux kustomization verify --wait --timeout 900s --kubeconfig .kubeconfig

      # On failure, snapshot in-cluster state before the delete below tears it
      # down, so the failure can still be diagnosed afterwards.
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p update-diagnostics
          nix develop --command just cluster debug > update-diagnostics/cluster-debug.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-diagnostics-${{ github.event.pull_request.number }}
          path: update-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete update cluster
        if: always()
        run: nix run .#default -- local cluster delete

  # Always-running gate = the required status check. Passes when the upgrade
  # verification succeeded OR was legitimately skipped (no manifest change);
  # fails if it failed/was cancelled, or if change detection itself failed. This
  # is what a path-filtered required check cannot do (it would stall forever).
  update:
    needs: [detect, upgrade]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Gate on the upgrade verification
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
          FLUX_CHANGED: ${{ needs.detect.outputs.flux }}
          BASELINE_FAILED: ${{ needs.upgrade.outputs.baseline_failed }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "change detection failed (result=$DETECT_RESULT)"; exit 1
          fi
          case "$UPGRADE_RESULT" in
            success|skipped)
              echo "upgrade gate OK (upgrade=$UPGRADE_RESULT, flux-changed=$FLUX_CHANGED)" ;;
            *)
              if [ "$BASELINE_FAILED" = "true" ]; then
                echo "::warning::upgrade failed because the MASTER BASELINE never converged -- a platform/infrastructure flake, not this PR. Re-run rather than treating this as a real upgrade break."
                echo "upgrade gate: baseline flake, PR unjudged (upgrade=$UPGRADE_RESULT, flux-changed=$FLUX_CHANGED)"
              else
                echo "upgrade verification did not pass (result=$UPGRADE_RESULT)"
              fi
              exit 1 ;;
          esac
