---
# CNPG point-in-time recovery on DOKS. Bootstraps a cluster from the PR branch,
# then archives a throwaway database through the barman-cloud plugin, destroys it,
# recovers it from the database-backup bucket bootstrap provisioned, and asserts
# the seeded row comes back. The kind equivalent runs in `local`; this is the half
# that exercises a real Spaces bucket and a real bucket-scoped key.
#
# Not folded into `preview`: that job runs the image-security gate, and a live
# Postgres pod puts unsuppressed CRITICALs from the postgres runtime image in front
# of it. Here there is no gate to trip.
#
# Runs on every PR (no `paths:` filter) so the `cnpg` gate always reports a status
# -- a path-filtered required check stalls PRs forever. The expensive `pitr` job is
# skipped internally unless the CNPG manifests, the drill, or the DO/Spaces client
# code change (flux/cluster/cloudnative-pg*, cluster.just,
# internal/{core,clients}/digitalocean/**). Make the `cnpg` job the required
# status check. This is now the ONLY workflow that provisions a real, billed DOKS
# cluster -- preview/update/velero's drills moved to kind; see the
# `reduce-doks-ci-cost` migration.
name: cnpg
on:
  pull_request:
permissions: {}
env:
  FORCE_COLOR: ""
  CLUSTER_NAME: platform-cnpg-${{ github.event.pull_request.number }}
  BASE_DOMAIN: cnpg.dantofa.dev
  # nyc3, nyc2, and atl1 have all hit insufficient s-2vcpu-4gb capacity;
  # override here rather than in dctl's --region default so only CI is
  # pinned to sfo2 -- geographically farthest from the NYC metro cluster
  # the first two share, same price as every other region ($24/mo, DO
  # doesn't price Droplets per-region), and a standard-tier region that
  # actually lists s-2vcpu-4gb (unlike atl1, which doesn't appear in that
  # size's regions list on the Sizes API at all).
  DOKS_REGION: sfo2
jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cnpg: ${{ steps.filter.outputs.cnpg }}
    steps:
      - name: Detect CNPG manifest, drill, or DO/Spaces client changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          # The drill lives in cluster.just, so a change to it must be exercised too
          # -- otherwise the test that proves recovery works is the one thing never
          # tested on DOKS. Same reasoning for the DO/Spaces client code: this is
          # the only job left that exercises a real bucket-scoped key, so a
          # regression there must not slip through on manifest-only path filters.
          if printf '%s\n' "$files" | grep -qE '^(flux/cluster/cloudnative-pg(-barman)?(\.yaml$|/)|cluster\.just$|internal/(core|clients)/digitalocean/)'; then
            echo "cnpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "cnpg=false" >> "$GITHUB_OUTPUT"
          fi

  pitr:
    needs: detect
    if: needs.detect.outputs.cnpg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    permissions:
      contents: read
    env:
      KUBECONFIG: .kubeconfig
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'go.sum', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Destroy cnpg cluster
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: >-
          nix develop --command
          bws run --project-id ${{ vars.BWS_PROJECT_ID }} --
          nix run .#default -- digitalocean cluster delete "$CLUSTER_NAME"

      - name: Create cnpg cluster
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: >-
          nix develop --command
          bws run --project-id ${{ vars.BWS_PROJECT_ID }} --
          nix run .#default -- digitalocean cluster create --name "$CLUSTER_NAME" --region "$DOKS_REGION" --wait

      - name: Tag cnpg cluster
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: >-
          nix develop --command
          bws run --project-id ${{ vars.BWS_PROJECT_ID }} --
          nix run .#default -- digitalocean cluster update "$CLUSTER_NAME" --tag ci-cnpg

      - name: Fetch cnpg kubeconfig
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          nix develop --command bws run --project-id ${{ vars.BWS_PROJECT_ID }} -- nix run .#default -- digitalocean cluster connect "$CLUSTER_NAME" --output .kubeconfig
          test -s .kubeconfig

      # Bootstrap the PR's manifests: links BOTH Spaces buckets (Velero's and the
      # database one this drill writes to) and installs the CNPG operator + plugin
      # from this PR's branch.
      - name: Bootstrap the cluster
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          BWS_PROJECT_ID: ${{ vars.BWS_PROJECT_ID }}
          BWS_ORGANIZATION_ID: ${{ vars.BWS_ORGANIZATION_ID }}
        # bws run strips BWS_ACCESS_TOKEN from the child, so pass it on the flag.
        run: >-
          nix develop --command
          bws run --project-id ${{ vars.BWS_PROJECT_ID }} --
          nix run .#default -- digitalocean cluster bootstrap "$CLUSTER_NAME"
          --source-type git --source-revision "$HEAD_REF" --base-domain "$BASE_DOMAIN"
          --tls-issuer selfsigned
          --bitwarden-token "$BWS_ACCESS_TOKEN"

      # Gate on the tree converging first: the drill waits on the CNPG
      # HelmReleases itself, but a half-reconciled cluster produces a confusing
      # failure rather than a useful one.
      - name: Verify Kustomizations reconciled
        run: nix run .#default -- flux kustomization verify --wait --timeout 900s --kubeconfig .kubeconfig

      # The drill reads db-backup-target + db-backup-credential from cnpg-system --
      # the contract bootstrap just published from a real Spaces bucket -- so it
      # needs no configuration here. That it passes at all is the proof that the
      # provisioned bucket and its scoped key are usable by a CNPG ObjectStore.
      - name: Verify CNPG point-in-time recovery
        run: nix develop --command just cluster verify db-backup

      - name: Tear down backup buckets
        if: always()
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          # Both buckets bootstrap created: Velero's, and the database one whose
          # key is deliberately separate from it. Each is best-effort -- a failed
          # unlink must not mask the failure that got us here.
          for b in "$CLUSTER_NAME-backup" "$CLUSTER_NAME-db-backup"; do
            nix develop --command \
              bws run --project-id ${{ vars.BWS_PROJECT_ID }} -- \
              nix run .#default -- digitalocean space unlink "$b" || true
          done

      - name: Capture failure diagnostics
        if: failure()
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          mkdir -p preview-diagnostics
          nix develop --command bws run --project-id ${{ vars.BWS_PROJECT_ID }} -- \
            nix run .#default -- digitalocean cluster list \
            >preview-diagnostics/digitalocean-clusters.txt 2>&1 || true
          nix develop --command just cluster debug || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cnpg-diagnostics-${{ github.event.pull_request.number }}
          path: preview-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Destroy cnpg cluster
        if: always()
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: >-
          nix develop --command
          bws run --project-id ${{ vars.BWS_PROJECT_ID }} --
          nix run .#default -- digitalocean cluster delete "$CLUSTER_NAME"

  # Always-running gate = the required status check (see the header comment).
  cnpg:
    needs: [detect, pitr]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Gate on the PITR drill
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          PITR_RESULT: ${{ needs.pitr.result }}
          CNPG_CHANGED: ${{ needs.detect.outputs.cnpg }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "change detection failed (result=$DETECT_RESULT)"; exit 1
          fi
          case "$PITR_RESULT" in
            success|skipped)
              echo "cnpg gate OK (pitr=$PITR_RESULT, cnpg-changed=$CNPG_CHANGED)" ;;
            *)
              echo "PITR drill did not pass (result=$PITR_RESULT)"; exit 1 ;;
          esac
