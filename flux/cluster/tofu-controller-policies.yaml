---
# Who may run Terraform, and as whom (issue #107). Separate from kyverno-policies
# because these policies match the Terraform kind, whose CRD the tofu-controller
# stack installs: dependsOn tofu-controller (wait: true, so the CRD is established)
# and kyverno (the ClusterPolicy CRD and webhooks). Static manifests, no
# substitution.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-controller-policies
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/cluster/tofu-controller-policies
  prune: true
  wait: true
  dependsOn:
    - name: kyverno
    - name: tofu-controller
  sourceRef:
    kind: ${source_kind}
    name: ${source_name}
    namespace: flux-system
