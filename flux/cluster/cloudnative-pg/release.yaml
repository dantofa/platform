---
# The CloudNativePG operator: one controller Deployment plus the Postgres CRDs
# (Cluster, Backup, ScheduledBackup, Pooler, ...). No `Cluster` CR is declared
# here, so no Postgres runs on a cluster until a downstream asks for one — the
# operator idles, and the postgres runtime image is never pulled or scanned.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cloudnative-pg
      # Exact pin; bumped by Renovate (flux manager).
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # The operator's own controller-runtime metrics (not a downstream Cluster's
    # per-instance Postgres metrics -- that stays each Cluster's own
    # enablePodMonitor switch, same split as every other platform-ships-the-
    # CRDs stack). Alloy already discovers PodMonitors
    # (prometheusOperatorObjects.enabled: true in k8s-monitoring), so this is
    # the only piece needed to make the operator visible.
    monitoring:
      podMonitorEnabled: true
    # Bound the controller's footprint: it lands on every cluster type, kind
    # included.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
