---
# global.crdWatcher: without it, the admission controller's discovery cache --
# what a generate rule's TARGET kind is validated against -- only refreshes on a
# poll hardcoded to 15m (not configurable without this flag). dependsOn only
# orders the apply; it can't make Kyverno notice a CRD a dependency just
# installed any faster than that poll. cnpg-backup-destination hit exactly this
# on a fresh cluster: eso finished, the ExternalSecret CRD existed, and the
# policy's dry-run still failed GVR resolution for several minutes because the
# admission controller's cache hadn't polled since. crdWatcher switches it to an
# informer that invalidates the cache on CRD add/update/delete, so a rule can
# target a CRD its own dependsOn just installed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno-system
spec:
  interval: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno-system
      interval: 10m
  timeout: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    global:
      crdWatcher: true
    admissionController:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 384Mi
    backgroundController:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    cleanupController:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    reportsController:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
