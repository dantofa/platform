---
# The barman-cloud CNPG-I plugin: one Deployment in cnpg-system plus the
# namespaced `ObjectStore` CRD a downstream `Cluster` points at for WAL archiving
# and base backups. The namespace and the HelmRepository are owned by the
# cloudnative-pg stack this dependsOn, so they are not redeclared here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 10m
  chart:
    spec:
      chart: plugin-barman-cloud
      # Exact pin; bumped by Renovate (flux manager).
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Bound the plugin's footprint: it lands on every cluster type, kind included.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
