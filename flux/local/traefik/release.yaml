---
# Traefik as the kind (local) ingress controller. Lives under flux/local (the
# kind-only tree) because it is deliberately local-specific: unlike the DOKS Traefik
# (flux/ingress/traefik), it drops the DO LoadBalancer + Cloudflare IP allowlist, the
# external-dns publishedService, and the cert-manager default cert, serving Traefik's
# built-in self-signed cert instead — no Cloudflare, no tunnel, no bws token.
#
# It is a NodePort Service on FIXED nodePorts, which kind maps to the host's real
# :80/:443 (extraPortMappings, rendered from localcore.IngressPortMappings — keep the
# two in sync; they are one contract). Combined with the wildcard DNS record pointing
# ${base_domain} at 127.0.0.1, that means host tools reach the cluster at its real URL
# — https://${base_domain}/... — with no port-forward and no per-tool resolver flags.
# kind has no LoadBalancer, so NodePort + host publication is what stands in for one.
#
# It is the default IngressClass, so the same vanilla Ingress objects route here just
# as on DOKS. Vanilla Ingresses (no `tls:` block) serve on the web (80) entrypoint;
# websecure (443) serves the self-signed cert for apps that want TLS. This keeps local
# test traffic on the loopback (no WAN round-trip / 520s); the tunnel path stays the
# DOKS default.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      # Exact pin; bumped by Renovate (flux manager). Manually bumped ahead of
      # Renovate here to pick up appVersion v3.7.13, fixing CVE-2026-65600
      # (ReplacePathRegex auth-bypass path traversal) and CVE-2026-88007
      # (HTTP/3 NTLM connection reuse) -- both unsuppressed CRITICALs on 41.0.2
      # (appVersion v3.7.6), caught by local.yml's image-scan gate (this is the
      # kind Traefik the gate actually scans; flux/ingress/traefik is DOKS-only
      # and untested by kind-based CI).
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    # Serve the cert-manager-issued default cert (certificate.yaml) on every
    # origin connection, so a vanilla Ingress with no `tls:` block still gets a
    # cert whose SANs match ${base_domain} — verifiable against the exported
    # local CA instead of needing a skip-verify flag per tool.
    tlsStore:
      default:
        defaultCertificate:
          secretName: traefik-default-tls
    service:
      spec:
        type: NodePort
    # Pinned nodePorts: kind's extraPortMappings target these by number at cluster
    # CREATE time, long before this HelmRelease exists, so they cannot be allocated
    # dynamically. Must match localcore.IngressHTTPNodePort / IngressHTTPSNodePort.
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 256Mi
