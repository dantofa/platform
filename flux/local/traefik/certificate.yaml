---
# Traefik's default TLS certificate on kind — the local counterpart of
# flux/ingress/traefik/certificate.yaml. Served for every origin connection via
# tlsStore.default (see release.yaml), so portable Ingresses need no `tls:` block
# and still get a cert whose SANs actually match the URL being requested.
#
# issuerRef is pinned to the local-ca ClusterIssuer, rather than carrying the
# per-cluster tls_issuer variable the DOKS cert substitutes: --tls-issuer is a
# DOKS-only flag (local cluster-vars never sets it), and kind has no ACME path
# anyway — no public DNS-01 for a loopback name, and Let's Encrypt's
# duplicate-certificate limit would be exhausted in a day by cluster recreates.
# There is exactly one possible local issuer, so there is no choice to carry.
#
# Covers ${base_domain} and its one-level wildcard, matching the wildcard DNS record
# that points both at 127.0.0.1 — so https://${base_domain}/… and
# https://<app>.${base_domain}/… both verify against the exported local CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default-tls
  namespace: traefik
spec:
  secretName: traefik-default-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  dnsNames:
    - ${base_domain}
    - "*.${base_domain}"
