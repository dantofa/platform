---
# The database-backup credential, in the shape the CNPG barman-cloud plugin reads:
# two discrete keys, because an ObjectStore selects them with SecretKeySelectors
# (s3Credentials.accessKeyId / .secretAccessKey) and cannot parse Velero's
# credentials file. The same object dctl writes on DOKS from a second
# bucket-scoped Spaces key; here it is static and points at the same SeaweedFS
# identity as ../seaweedfs/cluster/s3-config.yaml.
#
# On DOKS the two credentials are genuinely different keys on different buckets,
# so a database cannot reach the cluster's disaster-recovery data. Locally there
# is one SeaweedFS identity and one bucket, so the separation is a shape
# difference only -- the contract is identical, which is what lets the same
# `cluster verify db-backup` drill run on either cluster type.
apiVersion: v1
kind: Secret
metadata:
  name: db-backup-credential
  namespace: cnpg-system
type: Opaque
stringData:
  ACCESS_KEY_ID: localbackup
  ACCESS_SECRET_KEY: localbackupsecret
