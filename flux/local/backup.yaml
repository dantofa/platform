---
# The provider-agnostic backup contracts, pointed at the in-cluster SeaweedFS S3
# endpoint instead of a cloud bucket: backup-credential + backup-target in the
# velero namespace for the Velero stack, and db-backup-credential +
# db-backup-target in cnpg-system for CNPG ObjectStores. Both namespaces are
# ensured by `dctl local cluster bootstrap`, so this stack has no prerequisites;
# the velero stack depends on it so the credential/target exist before Velero
# installs. Nothing in the base stack consumes the database pair — the platform
# ships no ObjectStore — but exposing it here is what makes the contract
# identical on kind and DOKS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/local/backup
  prune: true
  sourceRef:
    kind: OCIRepository
    name: platform
